[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-route-routing-worker"
version = "0.1.0"
description = "Fail-closed Routing data and model worker adapters"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
model-context = ["budget-route-bus-intelligence-core==0.1.0"]
model-runtime = [
    "budget-route-bus-intelligence-core==0.1.0",
    "lightgbm>=4,<5",
]

[project.scripts]
routing-worker = "routing_worker.cli:main"
routing-worker-collector = "routing_worker.job_entrypoints:collector_main"
routing-worker-legacy = "routing_worker.job_entrypoints:legacy_main"
routing-worker-model = "routing_worker.job_entrypoints:model_main"
routing-worker-quality = "routing_worker.job_entrypoints:quality_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["routing_worker*"]
