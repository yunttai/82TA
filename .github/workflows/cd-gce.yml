name: CD - Build, Push & Deploy to GCE

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: gce-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/web/Dockerfile
          push: true
          build-args: |
            KAKAO_JS_API_KEY=${{ secrets.KAKAO_JS_API_KEY }}
            VITE_PRIVACY_DOCUMENT_VERSION=${{ vars.PRIVACY_DOCUMENT_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-web:latest
          cache-from: type=gha,scope=82ta-web
          cache-to: type=gha,mode=max,scope=82ta-web

      - name: Build & Push Service API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/service-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-service-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-service-api:latest
          cache-from: type=gha,scope=82ta-service-api
          cache-to: type=gha,mode=max,scope=82ta-service-api

      - name: Build & Push Routing API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/routing-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-routing-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-routing-api:latest
          cache-from: type=gha,scope=82ta-routing-api
          cache-to: type=gha,mode=max,scope=82ta-routing-api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: gce
    env:
      REMOTE_DIR: ${{ secrets.REMOTE_APP_DIR }}
      DOMAIN: ${{ secrets.DOMAIN }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      IMAGE_TAG: ${{ github.sha }}
      PRIVACY_DOCUMENT_VERSION: ${{ vars.PRIVACY_DOCUMENT_VERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 0. SSH
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add pinned host key
        env:
          HOST_KEY: ${{ secrets.HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10
          "${{ secrets.USER }}@${{ secrets.HOST }}" "echo OK"

      # 1. Remote directory and deploy-only env
      - name: Prepare remote directory & .deploy.env
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            REMOTE_DIR="'$REMOTE_DIR'" \
            DOMAIN="'$DOMAIN'" \
            LETSENCRYPT_EMAIL="'$LETSENCRYPT_EMAIL'" \
            IMAGE_TAG="'$IMAGE_TAG'" \
            DOCKERHUB_USERNAME="'$DOCKERHUB_USERNAME'" \
            PRIVACY_DOCUMENT_VERSION="'$PRIVACY_DOCUMENT_VERSION'" \
            bash -s <<'EOF'
          set -euo pipefail
          : "${REMOTE_DIR:?}"; : "${DOMAIN:?}"; : "${LETSENCRYPT_EMAIL:?}"
          : "${IMAGE_TAG:?}"; : "${DOCKERHUB_USERNAME:?}"; : "${PRIVACY_DOCUMENT_VERSION:?}"
          case "$REMOTE_DIR" in /*) ;; *) echo 'REMOTE_APP_DIR must be absolute' >&2; exit 1;; esac
          test "$REMOTE_DIR" != "/"
          mkdir -p "$REMOTE_DIR"/nginx "$REMOTE_DIR"/certbot/{config,www,logs,internal}
          test -s "$REMOTE_DIR/.env" || {
            echo 'ERROR: pre-provision REMOTE_APP_DIR/.env from src/infra/gce/.env.example' >&2
            exit 1
          }
          chmod 600 "$REMOTE_DIR/.env"
          umask 077
          printf 'DOMAIN=%s\nLETSENCRYPT_EMAIL=%s\nIMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\nPRIVACY_DOCUMENT_VERSION=%s\n' \
            "$DOMAIN" "$LETSENCRYPT_EMAIL" "$IMAGE_TAG" "$DOCKERHUB_USERNAME" \
            "$PRIVACY_DOCUMENT_VERSION" > "$REMOTE_DIR/.deploy.env"
          EOF

      # 2. HTTP-only Nginx and Compose
      - name: Upload HTTP-only Nginx template and Compose
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/nginx/default.http.conf.template \
            "$SSH_TARGET:$REMOTE_DIR/nginx/default.conf.template"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/docker-compose.prod.yml \
            "$SSH_TARGET:$REMOTE_DIR/docker-compose.prod.yml"

      # 3. Start HTTP stack
      - name: Start HTTP-only stack
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            REMOTE_DIR="'$REMOTE_DIR'" bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          docker compose --env-file .env --env-file .deploy.env \
            -f docker-compose.prod.yml down --remove-orphans || true
          docker compose --env-file .env --env-file .deploy.env \
            -f docker-compose.prod.yml up -d nginx web
          EOF

      # 4. HTTP health
      - name: Wait for HTTP
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl --fail --silent --show-error --max-time 5 "http://$DOMAIN/healthz" >/dev/null; then
              echo "HTTP OK"
              exit 0
            fi
            echo "...waiting HTTP ($i/24)"
            sleep 5
          done
          echo 'HTTP health check timed out' >&2
          exit 1

      # 5. Public certificate
      - name: Issue / Renew SSL
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            REMOTE_DIR="'$REMOTE_DIR'" DOMAIN="'$DOMAIN'" \
            LETSENCRYPT_EMAIL="'$LETSENCRYPT_EMAIL'" bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          docker compose --env-file .env --env-file .deploy.env \
            -f docker-compose.prod.yml run --rm certbot \
            certonly --webroot -w /var/www/certbot \
            --non-interactive --keep-until-expiring \
            --email "$LETSENCRYPT_EMAIL" -d "$DOMAIN" \
            --agree-tos --no-eff-email --rsa-key-size 4096
          EOF

      # 6. Private Service -> Routing TLS certificate
      - name: Prepare private Routing TLS certificate
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            REMOTE_DIR="'$REMOTE_DIR'" bash -s <<'EOF'
          set -euo pipefail
          internal="$REMOTE_DIR/certbot/internal"
          if [ ! -s "$internal/routing.crt" ] || [ ! -s "$internal/routing.key" ]; then
            openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 825 \
              -keyout "$internal/routing.key" -out "$internal/routing.crt" \
              -subj '/CN=routing.internal' \
              -addext 'subjectAltName=DNS:routing.internal'
          fi
          cat /etc/ssl/certs/ca-certificates.crt "$internal/routing.crt" \
            > "$internal/routing-ca-bundle.pem"
          chmod 600 "$internal/routing.key"
          chmod 644 "$internal/routing.crt" "$internal/routing-ca-bundle.pem"
          EOF

      # 7. HTTPS Nginx
      - name: Upload HTTPS Nginx template
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/nginx/default.https.conf.template \
            "$SSH_TARGET:$REMOTE_DIR/nginx/default.conf.template"

      # 8. Migrate and deploy all services
      - name: Deploy latest stack
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            REMOTE_DIR="'$REMOTE_DIR'" bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          compose=(docker compose --env-file .env --env-file .deploy.env -f docker-compose.prod.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" --profile tools run --rm service-migrate
          "${compose[@]}" --profile tools run --rm routing-migrate
          "${compose[@]}" up -d --remove-orphans --wait --wait-timeout 180
          "${compose[@]}" up -d --force-recreate --no-deps --wait --wait-timeout 60 nginx
          EOF

      # 9. HTTPS health
      - name: Verify HTTPS
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl --fail --silent --show-error --max-time 5 "https://$DOMAIN/healthz" >/dev/null \
              && curl --fail --silent --show-error --max-time 5 "https://$DOMAIN/api/v1/health" >/dev/null; then
              echo "HTTPS OK"
              exit 0
            fi
            echo "...waiting HTTPS ($i/18)"
            sleep 10
          done
          echo 'HTTPS health check timed out' >&2
          exit 1

      # 10. Cleanup dangling images only
      - name: Prune dangling images
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET"
          "docker image prune -f --filter 'until=168h' || true"

  notify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment result
        run: echo "build=${{ needs.build-and-push.result }} deploy=${{ needs.deploy.result }}"
