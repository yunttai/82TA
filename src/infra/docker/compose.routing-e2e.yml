name: 82ta-routing-e2e

x-routing-auth: &routing-auth
  ROUTING_SERVICE_JWT_SECRET: local-e2e-routing-jwt-9Vq4xP7mK2sL6wN8cR5tY3uA
  ROUTING_SERVICE_JWT_ISSUER: service-api
  ROUTING_SERVICE_JWT_AUDIENCE: routing-api

services:
  routing-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: routing
      POSTGRES_USER: routing
      POSTGRES_PASSWORD: local-routing-db-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing -d routing"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - routing-db-data:/var/lib/postgresql/data

  routing-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  routing-api:
    build:
      context: ../..
      dockerfile: infra/docker/routing-api/Dockerfile
    environment:
      <<: *routing-auth
      ROUTING_RUNTIME_ENVIRONMENT: DEVELOPMENT
      ROUTING_PRIVATE_OPENAPI_PATH: /app/src/contracts/openapi/routing-private.v1.yaml
      ROUTING_ALLOWED_HOSTS: routing-api,localhost,127.0.0.1
      ROUTING_DB_NAME: routing
      ROUTING_DB_USER: routing
      ROUTING_DB_PASSWORD: local-routing-db-only
      ROUTING_DB_HOST: routing-db
      ROUTING_DB_PORT: "5432"
      ROUTING_DB_SSLMODE: disable
      ROUTING_REDIS_URL: redis://routing-redis:6379/0
      ROUTING_ALLOW_FIXTURE_BACKEND: "false"
      ROUTING_PRODUCTION_DEPENDENCIES_FACTORY: ${ROUTING_PRODUCTION_DEPENDENCIES_FACTORY:-}
      ROUTING_PROVIDER_CONFIG_FACTORY: ${ROUTING_PROVIDER_CONFIG_FACTORY:-provider_core.production:build_kakao_baseline_config}
      ROUTING_PROVIDER_EVIDENCE_JSON: ${ROUTING_PROVIDER_EVIDENCE_JSON:-{}}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      GBIS_SERVICE_KEY: ${GBIS_SERVICE_KEY:-}
      GITS_API_KEY: ${GITS_API_KEY:-}
      TMAP_APP_KEY: ${TMAP_APP_KEY:-}
      ODSAY_API_KEY: ${ODSAY_API_KEY:-}
    command:
      - /bin/sh
      - -ec
      - python manage.py migrate --noinput && exec python -m gunicorn routing_deployment.wsgi:application --bind=0.0.0.0:8000 --workers=2 --threads=4 --timeout=10 --access-logfile /dev/null --error-logfile=-
    depends_on:
      routing-db:
        condition: service_healthy
      routing-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  service-api:
    build:
      context: ../..
      dockerfile: infra/docker/service-api/Dockerfile
    environment:
      SERVICE_ENVIRONMENT: development
      SERVICE_DEBUG: "false"
      SERVICE_SECRET_KEY: local-compose-development-only
      SERVICE_ALLOWED_HOSTS: service-api,localhost,127.0.0.1
      SERVICE_ROUTING_GATEWAY: http
      SERVICE_ROUTING_API_BASE_URL: http://routing-api:8000
      SERVICE_ROUTING_API_ALLOWED_HOSTS: routing-api
      SERVICE_ROUTING_VERIFY_SSL: "false"
      SERVICE_ROUTING_JWT_SECRET: local-e2e-routing-jwt-9Vq4xP7mK2sL6wN8cR5tY3uA
      SERVICE_ROUTING_JWT_ISSUER: service-api
      SERVICE_ROUTING_JWT_AUDIENCE: routing-api
      SERVICE_ROUTING_JWT_TTL_SECONDS: "60"
      SERVICE_ROUTING_DEADLINE_MILLISECONDS: "6500"
      DATABASE_URL: sqlite:////tmp/service-api.sqlite3
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
    command:
      - /bin/sh
      - -ec
      - python manage.py migrate --noinput && exec python -m gunicorn service_wsgi:application --bind=0.0.0.0:8000 --workers=2 --threads=4 --timeout=10 --access-logfile /dev/null --error-logfile=-
    depends_on:
      routing-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/infra/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      args:
        KAKAO_JS_API_KEY: ${KAKAO_JS_API_KEY:-}
        VITE_PRIVACY_DOCUMENT_VERSION: local-development
    environment:
      SERVICE_UPSTREAM: service-api:8000
      CONTENT_SECURITY_POLICY: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'"
    depends_on:
      service-api:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755

volumes:
  routing-db-data:
