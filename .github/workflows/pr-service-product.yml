name: service-product-pr

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/pr-service-product.yml"
      - "src/apps/web/**"
      - "src/services/service-api/**"
      - "src/contracts/**"
      - "src/generated/**"
      - "src/infra/**"
      - "src/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml jsonschema openapi-spec-validator
      - run: python src/scripts/validate_repository.py
      - run: python src/scripts/verify_contract_lock.py
      - run: python -m unittest discover -s src/tests/contracts -p "test_*.py"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
        working-directory: src/services/service-api
      - run: uv run python manage.py makemigrations --check --dry-run
        working-directory: src/services/service-api
      - run: uv run python manage.py test
        working-directory: src/services/service-api

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: src/apps/web
      - run: npm run typecheck
        working-directory: src/apps/web
      - run: npm test
        working-directory: src/apps/web
      - run: npm run build
        working-directory: src/apps/web

  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: src/apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: src/apps/web
      - run: npm run test:e2e:chromium
        working-directory: src/apps/web

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: Validate infrastructure definitions
        run: |
          python src/infra/scripts/validate_infra.py
          docker compose -f src/infra/docker/compose.service-product.yml config --quiet

      - name: Start Service Product with real Redis
        run: >-
          docker compose -f src/infra/docker/compose.service-product.yml
          up -d --build --wait --wait-timeout 180

      - name: Verify real Redis and shared Service coordination
        env:
          CI_REDIS_SUBJECT: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          compose=(docker compose -f src/infra/docker/compose.service-product.yml)

          pong=$("${compose[@]}" exec -T service-redis redis-cli PING | tr -d '\r')
          [[ "$pong" == "PONG" ]]

          backend=$(
            "${compose[@]}" exec -T service-api python manage.py shell \
              -c "from django.conf import settings; print(settings.COORDINATION_BACKEND)" \
              | tail -n 1 | tr -d '\r'
          )
          [[ "$backend" == "redis" ]]

          first_rate=$(
            "${compose[@]}" exec -T -e CI_REDIS_SUBJECT="$CI_REDIS_SUBJECT" \
              service-api python manage.py shell -c \
              "import os; from journeys.coordination import redis_coordination; print(redis_coordination().enforce_rate_limit(scope='ci-real-redis', subject=os.environ['CI_REDIS_SUBJECT'], limit=1))" \
              | tail -n 1 | tr -d '\r'
          )
          second_rate=$(
            "${compose[@]}" exec -T -e CI_REDIS_SUBJECT="$CI_REDIS_SUBJECT" \
              service-api python manage.py shell -c \
              "import os; from journeys.coordination import redis_coordination; print(redis_coordination().enforce_rate_limit(scope='ci-real-redis', subject=os.environ['CI_REDIS_SUBJECT'], limit=1))" \
              | tail -n 1 | tr -d '\r'
          )
          [[ "$first_rate" == "True" ]]
          [[ "$second_rate" == "False" ]]

          first_idempotency=$(
            "${compose[@]}" exec -T -e CI_REDIS_SUBJECT="$CI_REDIS_SUBJECT" \
              service-api python manage.py shell -c \
              "import os; from journeys.coordination import redis_coordination; print(redis_coordination().begin_idempotency(owner_key=os.environ['CI_REDIS_SUBJECT'], fingerprint='ci-fingerprint').state)" \
              | tail -n 1 | tr -d '\r'
          )
          second_idempotency=$(
            "${compose[@]}" exec -T -e CI_REDIS_SUBJECT="$CI_REDIS_SUBJECT" \
              service-api python manage.py shell -c \
              "import os; from journeys.coordination import redis_coordination; print(redis_coordination().begin_idempotency(owner_key=os.environ['CI_REDIS_SUBJECT'], fingerprint='ci-fingerprint').state)" \
              | tail -n 1 | tr -d '\r'
          )
          [[ "$first_idempotency" == "CLAIMED" ]]
          [[ "$second_idempotency" == "IN_PROGRESS" ]]

          keys=$("${compose[@]}" exec -T service-redis redis-cli --scan --pattern '82ta:service:local:*')
          [[ -n "$keys" ]]
          if grep -Fq "$CI_REDIS_SUBJECT" <<<"$keys"; then
            echo "Redis key leaked the raw coordination subject" >&2
            exit 1
          fi

      - name: Dump Service Product logs on failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose -f src/infra/docker/compose.service-product.yml ps -a
          docker compose -f src/infra/docker/compose.service-product.yml logs --no-color --tail 200

      - name: Remove Service Product containers and Redis volume
        if: always()
        continue-on-error: true
        run: >-
          docker compose -f src/infra/docker/compose.service-product.yml
          down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: src
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: src
          artifact-name: service-product-sbom.spdx.json
