openapi: 3.1.0
info:
  title: Budget Route Service Public API
  version: 1.6.0
servers:
  - url: https://api.example.invalid
security: []
paths:
  /api/v1/auth/register:
    post:
      operationId: registerWithEmail
      description: Creates an account and starts an authenticated HttpOnly cookie session. CSRF protection is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRegistrationInput'}
            example:
              email: user@example.com
              password: correct-horse-battery-staple
              nickname: 82TA 사용자
              documentVersion: local-development
              requiredPrivacyAccepted: true
              optionalConsents:
                SEARCH_HISTORY: false
                PRECISE_LOCATION: false
                PRODUCT_ANALYTICS: false
                ROUTING_FEEDBACK: false
      responses:
        '201':
          description: Registered USER session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionContext'}
              example: {subjectType: USER, authenticated: true, expiresAt: '2026-09-06T12:00:00+09:00', email: user@example.com}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/login:
    post:
      operationId: loginWithEmail
      description: Verifies an email credential and starts an authenticated HttpOnly cookie session. Failure does not reveal whether the account exists. CSRF protection is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailCredentialInput'}
            example: {email: user@example.com, password: correct-horse-battery-staple}
      responses:
        '200':
          description: Authenticated USER session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionContext'}
              example: {subjectType: USER, authenticated: true, expiresAt: '2026-09-06T12:00:00+09:00', email: user@example.com}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/guest-sessions:
    post:
      operationId: createGuestSession
      responses:
        '201':
          description: Short-lived guest credential for ownership-bound searches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestSessionCredential'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/session:
    get:
      operationId: getCurrentSession
      security:
        - sessionCookie: []
        - guestToken: []
      responses:
        '200':
          description: Current authenticated or guest session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionContext'}
        '401': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeCurrentSession
      security:
        - sessionCookie: []
        - guestToken: []
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/places/suggest:
    get:
      operationId: suggestPlaces
      parameters:
        - in: query
          name: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
        - in: query
          name: lon
          schema: {type: number}
        - in: query
          name: lat
          schema: {type: number}
      responses:
        '200':
          description: Place suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /api/v1/places/reverse-geocode:
    get:
      operationId: reverseGeocode
      parameters:
        - in: query
          name: lon
          required: true
          schema: {type: number}
        - in: query
          name: lat
          required: true
          schema: {type: number}
      responses:
        '200':
          description: Place display information
          content:
            application/json:
              schema: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /api/v1/bike-options:
    get:
      operationId: getBikeOptions
      description: >-
        Returns the nearest Seoul Bike stations for an origin and destination plus
        a simple station-to-station cycling estimate. The estimate uses straight-line
        distance and an assumed speed of 15 km/h; live bicycle availability is not provided.
        Station lists are sorted by straight-line distance and then station ID. Stations
        farther than 5 km are omitted, so coordinates outside the service area return
        empty lists and a null estimate with HTTP 200. The estimate references the first
        pickup and nearest return station with a different station ID. Both referenced
        IDs must occur in their respective station lists. The estimate is null when the
        pickup list is empty or the return list has no station distinct from that first pickup.
      parameters:
        - in: query
          name: originLon
          required: true
          schema: {type: number, minimum: 124, maximum: 132}
        - in: query
          name: originLat
          required: true
          schema: {type: number, minimum: 33, maximum: 39.5}
        - in: query
          name: destinationLon
          required: true
          schema: {type: number, minimum: 124, maximum: 132}
        - in: query
          name: destinationLat
          required: true
          schema: {type: number, minimum: 33, maximum: 39.5}
      responses:
        '200':
          description: Nearby Seoul Bike stations and a clearly disclosed simple cycling estimate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BikeOptionsResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/route-searches:
    post:
      operationId: createRouteSearch
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - in: header
          name: X-Correlation-Id
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicRouteSearchRequest'}
      responses:
        '200':
          description: Route search result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicRouteSearchResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '504': {$ref: '#/components/responses/Problem'}
    get:
      operationId: listRouteSearches
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Search history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicRouteSearchResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/route-searches/{searchId}:
    get:
      operationId: getRouteSearch
      security:
        - sessionCookie: []
        - guestToken: []
      parameters:
        - in: path
          name: searchId
          required: true
          schema: {type: string}
        - in: header
          name: X-Guest-Token
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Stored route search
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicRouteSearchResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/route-searches/{searchId}/feedback:
    post:
      operationId: submitRouteFeedback
      security:
        - sessionCookie: []
        - guestToken: []
      parameters:
        - in: path
          name: searchId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RouteFeedbackInput'}
      responses:
        '204': {description: Feedback accepted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPreferences'}
          headers:
            ETag:
              description: Quoted preference version for optimistic concurrency
              schema: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
    put:
      operationId: updatePreferences
      security: [{sessionCookie: []}]
      parameters:
        - in: header
          name: If-Match
          required: false
          description: Optional quoted preference version. First-party clients send the ETag returned by GET.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPreferences'}
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPreferences'}
          headers:
            ETag:
              description: Quoted preference version for optimistic concurrency
              schema: {type: string}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/me/saved-places:
    get:
      operationId: listSavedPlaces
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Saved places
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SavedPlace'}
    post:
      operationId: createSavedPlace
      description: >-
        Creates one owner-bound saved place containing an exact coordinate. Requires
        an authenticated USER session, CSRF protection, and current accepted
        PRECISE_LOCATION consent. Invalid place or coordinate data uses
        INVALID_COORDINATE or CONSTRAINT_OUT_OF_RANGE; a missing or expired session
        uses AUTH_REQUIRED or SESSION_EXPIRED; missing current location consent uses
        CONSENT_REQUIRED. The response is owner-only and Cache-Control no-store.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedPlaceInput'}
      responses:
        '201':
          description: Saved place
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedPlace'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/me/saved-places/{savedPlaceId}:
    patch:
      operationId: updateSavedPlace
      description: >-
        Partially updates an owner-bound saved place. Current accepted
        PRECISE_LOCATION consent is required only when the request contains place and
        therefore changes the exact coordinate. Label-only and isSensitive-only
        updates remain available after location-consent withdrawal. Authentication,
        owner authorization, and CSRF protection still apply; a missing or
        other-owner resource is returned as 404.
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/SavedPlaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedPlaceUpdate'}
      responses:
        '200':
          description: Updated saved place
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedPlace'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteSavedPlace
      description: >-
        Soft-deletes an owner-bound saved place. PRECISE_LOCATION consent is not
        required so a user can delete retained location data after withdrawing
        consent. Authentication, owner authorization, and CSRF protection still
        apply; a missing or other-owner resource is returned as 404.
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/SavedPlaceId'}
      responses:
        '204': {description: Saved place deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/me/favorite-journeys:
    get:
      operationId: listFavoriteJourneys
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Favorite journeys
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FavoriteJourney'}
    post:
      operationId: createFavoriteJourney
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteJourneyInput'}
      responses:
        '201':
          description: Favorite journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteJourney'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/me/favorite-journeys/from-places:
    post:
      operationId: createFavoriteJourneyFromPlaces
      description: >-
        Atomically creates two owner-bound saved places and the favorite journey that
        references them. First creation requires current PRECISE_LOCATION consent.
        Repeating the same owner, Idempotency-Key, and canonical request body within
        24 hours returns the original immutable 201 receipt without creating location
        data, consuming the write quota, or requiring current PRECISE_LOCATION consent
        again. After expiry the request is a new creation and the current consent gate
        applies. Reusing an unexpired key with another body returns
        IDEMPOTENCY_CONFLICT. Invalid coordinates use INVALID_COORDINATE;
        invalid labels or conditions use CONSTRAINT_OUT_OF_RANGE; a missing or expired
        USER session uses AUTH_REQUIRED or SESSION_EXPIRED; missing current location
        consent uses CONSENT_REQUIRED; quota rejection uses RATE_LIMITED. CSRF
        protection is required. The response is owner-only and Cache-Control no-store.
      security: [{sessionCookie: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteJourneyFromPlacesInput'}
      responses:
        '201':
          description: Immutable creation receipt; clients refresh owner-scoped lists for current representations
          headers:
            Cache-Control:
              description: Sensitive owner data must not be stored by shared or browser caches.
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteJourneyFromPlacesResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/me/favorite-journeys/{favoriteJourneyId}:
    patch:
      operationId: updateFavoriteJourney
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/FavoriteJourneyId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteJourneyUpdate'}
      responses:
        '200':
          description: Updated favorite journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteJourney'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteFavoriteJourney
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/FavoriteJourneyId'}
      responses:
        '204': {description: Favorite journey deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/me/consents:
    get:
      operationId: listConsents
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Latest recorded state for each consent type
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ConsentRecord'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/me/consents/{consentType}:
    put:
      operationId: recordConsent
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/ConsentType'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentInput'}
      responses:
        '200':
          description: Recorded consent state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentRecord'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/me/data-exports:
    post:
      operationId: createDataExport
      security: [{sessionCookie: []}]
      responses:
        '202':
          description: Export scheduled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataRightsJob'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/me/data-exports/{jobId}:
    get:
      operationId: getDataExport
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/DataRightsJobId'}
      responses:
        '200':
          description: Export status and a short-lived download URL when complete
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataRightsJob'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/me/data-deletions:
    post:
      operationId: createDataDeletion
      security: [{sessionCookie: []}]
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataRightsJob'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/me/data-deletions/{jobId}:
    get:
      operationId: getDataDeletion
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/DataRightsJobId'}
      responses:
        '200':
          description: Deletion status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataRightsJob'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/me/data:
    delete:
      operationId: deleteUserData
      deprecated: true
      description: Compatibility alias. New clients use POST /api/v1/me/data-deletions and poll its status.
      security: [{sessionCookie: []}]
      responses:
        '202':
          description: Deletion scheduled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataRightsJob'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/support/capabilities:
    get:
      operationId: getPublicCapabilities
      responses:
        '200':
          description: Supported regions and features
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicCapabilities'}
  /api/v1/health:
    get:
      operationId: publicHealth
      responses:
        '200':
          description: Minimal public health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok, degraded]}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
    guestToken:
      type: apiKey
      in: header
      name: X-Guest-Token
  parameters:
    SavedPlaceId:
      in: path
      name: savedPlaceId
      required: true
      schema: {type: string, format: uuid}
    FavoriteJourneyId:
      in: path
      name: favoriteJourneyId
      required: true
      schema: {type: string, format: uuid}
    ConsentType:
      in: path
      name: consentType
      required: true
      schema: {$ref: '#/components/schemas/ConsentType'}
    DataRightsJobId:
      in: path
      name: jobId
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema: {$ref: './common/components.v1.yaml#/components/schemas/ProblemDetails'}
  schemas:
    BikeStationOption:
      type: object
      additionalProperties: false
      required: [stationId, name, district, address, coordinate, rackCount, distanceFromPointMeters]
      properties:
        stationId: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 200}
        district: {type: string, minLength: 1, maxLength: 100}
        address: {type: [string, 'null'], maxLength: 300}
        coordinate: {$ref: './common/components.v1.yaml#/components/schemas/Coordinate'}
        rackCount:
          type: [integer, 'null']
          minimum: 0
          description: Installed rack count in the published station snapshot, not live bicycle availability. Null means unknown and zero means a confirmed zero.
        distanceFromPointMeters:
          type: integer
          minimum: 0
          description: Straight-line distance from the requested origin or destination to this station.
    BikeRideEstimate:
      type: object
      additionalProperties: false
      required: [pickupStationId, returnStationId, distanceMeters, durationSeconds, assumedSpeedKph, distanceMethod]
      properties:
        pickupStationId:
          type: string
          minLength: 1
          description: References one stationId in pickupStations.
        returnStationId:
          type: string
          minLength: 1
          description: References a different stationId in returnStations.
        distanceMeters: {type: integer, minimum: 0}
        durationSeconds: {type: integer, minimum: 0}
        assumedSpeedKph: {type: number, const: 15}
        distanceMethod: {type: string, const: STRAIGHT_LINE}
    BikeDataSource:
      type: object
      additionalProperties: false
      required: [name, url, license, publishedAt]
      properties:
        name: {type: string, minLength: 1}
        url: {type: string, format: uri}
        license: {type: string, minLength: 1}
        publishedAt: {type: string, format: date}
    BikeOptionsResponse:
      type: object
      additionalProperties: false
      required: [pickupStations, returnStations, rideEstimate, searchRadiusMeters, stationDataMonth, availabilityStatus, dataSource]
      properties:
        pickupStations:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {$ref: '#/components/schemas/BikeStationOption'}
        returnStations:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {$ref: '#/components/schemas/BikeStationOption'}
        rideEstimate:
          oneOf:
            - {$ref: '#/components/schemas/BikeRideEstimate'}
            - {type: 'null'}
        searchRadiusMeters:
          type: integer
          const: 5000
        stationDataMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Month identified by the official station snapshot; it does not claim a day-level observation date.
        availabilityStatus:
          type: string
          const: NOT_PROVIDED
          description: Live bicycle and empty-rack counts are intentionally not claimed by this endpoint.
        dataSource: {$ref: '#/components/schemas/BikeDataSource'}
    PublicRouteSearchRequest:
      type: object
      additionalProperties: false
      required: [origin, destination, departure, taxiBudget, preferences, requestedRecommendations]
      properties:
        origin: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        destination: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        departure:
          description: ARRIVE_BY is reserved in the Public API but returns ARRIVE_BY_UNSUPPORTED until the Private Routing API supports that search type.
          type: object
          additionalProperties: false
          required: [type, time]
          properties:
            type: {type: string, enum: [DEPART_AT, ARRIVE_BY]}
            time: {type: string, format: date-time}
        arrivalDeadline: {type: [string, 'null'], format: date-time}
        taxiBudget: {$ref: './common/components.v1.yaml#/components/schemas/TaxiBudget'}
        preferences: {$ref: '#/components/schemas/PublicRouteSearchPreferences'}
        requestedRecommendations:
          type: array
          uniqueItems: true
          items: {type: string, enum: [FASTEST, STABLE, EFFICIENT, PUBLIC_TRANSIT_ONLY]}
        saveToHistory:
          type: boolean
          default: false
          description: Service-local opt-in. It is never forwarded to Routing and requires an authenticated owner with current SEARCH_HISTORY consent when true.
    PublicRouteSearchResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, searchId, status, generatedAt, expiresAt, recommendations, warnings, support]
      properties:
        contractVersion: {type: string}
        searchId: {type: string}
        status: {type: string, enum: [COMPLETE, PARTIAL, NO_FEASIBLE_ROUTE, PROVIDER_UNAVAILABLE, FAILED, EXPIRED]}
        generatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        baseline:
          oneOf:
            - {$ref: './common/components.v1.yaml#/components/schemas/RouteCandidate'}
            - {type: 'null'}
        recommendations:
          type: object
          additionalProperties: false
          properties:
            fastest:
              oneOf: [{$ref: './common/components.v1.yaml#/components/schemas/RouteCandidate'}, {type: 'null'}]
            stable:
              oneOf: [{$ref: './common/components.v1.yaml#/components/schemas/RouteCandidate'}, {type: 'null'}]
            efficient:
              oneOf: [{$ref: './common/components.v1.yaml#/components/schemas/RouteCandidate'}, {type: 'null'}]
            publicTransitOnly:
              oneOf: [{$ref: './common/components.v1.yaml#/components/schemas/RouteCandidate'}, {type: 'null'}]
        paretoFrontier:
          type: array
          items:
            type: object
            required: [routeId, taxiCostUpper, p50Seconds, p90Seconds]
            properties:
              routeId: {type: string}
              taxiCostUpper: {type: integer}
              p50Seconds: {type: integer}
              p90Seconds: {type: integer}
        warnings: {type: array, items: {type: string}}
        support: {$ref: '#/components/schemas/PublicCapabilities'}
        history: {$ref: '#/components/schemas/HistoryMetadata'}
        requestSummary:
          description: >-
            Optional owner-visible, coordinate-free input summary for history display.
            It is not sufficient to recreate a route search and must not be used as a
            quick-search request.
          oneOf:
            - {$ref: '#/components/schemas/RouteSearchRequestSummary'}
            - {type: 'null'}
    PublicRouteSearchPreferences:
      type: object
      additionalProperties: false
      required: [maxWalkSeconds, maxTransfers, maxTaxiLegs, optimization]
      properties:
        maxWalkSeconds: {type: integer, minimum: 0, maximum: 7200}
        maxTransfers: {type: integer, minimum: 0, maximum: 8}
        maxTaxiLegs: {type: integer, minimum: 0, maximum: 3}
        allowTaxiBridge: {type: boolean}
        avoidHighBusSeatRisk: {type: boolean}
        allowedModes:
          description: Passed to Routing without Service-side ranking or cost interpretation. Omission uses all canonical modes.
          type: array
          uniqueItems: true
          items: {type: string, enum: [WALK, WAIT, TRANSFER, TAXI, BUS, SUBWAY, GTX, TRAIN]}
        optimization: {type: string, enum: [FASTEST, STABLE, EFFICIENT, BALANCED]}
        accessibility: {$ref: './common/components.v1.yaml#/components/schemas/Accessibility'}
    RouteSearchRequestSummary:
      type: object
      additionalProperties: false
      required: [originDisplayName, destinationDisplayName, departureTime, taxiBudget, preferences]
      properties:
        originDisplayName: {type: string, minLength: 1, maxLength: 200}
        destinationDisplayName: {type: string, minLength: 1, maxLength: 200}
        departureTime: {type: string, format: date-time}
        arrivalDeadline: {type: [string, 'null'], format: date-time}
        taxiBudget: {$ref: './common/components.v1.yaml#/components/schemas/TaxiBudget'}
        preferences: {$ref: '#/components/schemas/PublicRouteSearchPreferences'}
    HistoryMetadata:
      type: object
      additionalProperties: false
      required: [saved, ownerKind]
      properties:
        saved: {type: boolean}
        ownerKind: {type: string, enum: [GUEST, USER]}
        retainedUntil: {type: [string, 'null'], format: date-time}
    GuestSessionCredential:
      type: object
      additionalProperties: false
      required: [guestToken, expiresAt]
      properties:
        guestToken:
          type: string
          minLength: 32
          writeOnly: true
          description: Opaque bearer credential returned once and never persisted in browser localStorage.
        expiresAt: {type: string, format: date-time}
    SessionContext:
      type: object
      additionalProperties: false
      required: [subjectType, authenticated, expiresAt]
      properties:
        subjectType: {type: string, enum: [GUEST, USER]}
        authenticated: {type: boolean}
        expiresAt: {type: string, format: date-time}
        email:
          type: string
          format: email
          maxLength: 254
          description: Present only for the current authenticated USER session.
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: Present only for the current authenticated USER session.
    EmailRegistrationInput:
      type: object
      additionalProperties: false
      required: [email, password, nickname, documentVersion, requiredPrivacyAccepted, optionalConsents]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        nickname: {type: string, minLength: 2, maxLength: 20}
        documentVersion: {type: string, minLength: 1, maxLength: 64}
        requiredPrivacyAccepted: {type: boolean, const: true}
        optionalConsents:
          type: object
          additionalProperties: false
          required: [SEARCH_HISTORY, PRECISE_LOCATION, PRODUCT_ANALYTICS, ROUTING_FEEDBACK]
          properties:
            SEARCH_HISTORY: {type: boolean}
            PRECISE_LOCATION: {type: boolean}
            PRODUCT_ANALYTICS: {type: boolean}
            ROUTING_FEEDBACK: {type: boolean}
    EmailCredentialInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    RouteFeedbackInput:
      type: object
      additionalProperties: false
      required: [selectedRouteId]
      properties:
        selectedRouteId: {type: string}
        actualDurationSeconds: {type: [integer, 'null'], minimum: 0}
        actualTaxiCost: {type: [integer, 'null'], minimum: 0}
        arrivedOnTime: {type: [boolean, 'null']}
        busOutcome: {type: [object, 'null']}
        rating: {type: [integer, 'null'], minimum: 1, maximum: 5}
        comment: {type: [string, 'null'], maxLength: 1000}
    UserPreferences:
      type: object
      additionalProperties: false
      required: [defaultTaxiBudget, maxWalkSeconds, maxTransfers, maxTaxiLegs, optimizationProfile]
      properties:
        defaultTaxiBudget: {type: integer, minimum: 0}
        maxWalkSeconds: {type: integer, minimum: 0, maximum: 7200}
        maxTransfers: {type: integer, minimum: 0, maximum: 8}
        maxTaxiLegs: {type: integer, minimum: 0, maximum: 3}
        optimizationProfile: {type: string, enum: [FASTEST, STABLE, EFFICIENT, BALANCED]}
        accessibility: {$ref: './common/components.v1.yaml#/components/schemas/Accessibility'}
        privacy: {type: object}
        version: {type: integer, minimum: 1, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    SavedPlaceInput:
      type: object
      additionalProperties: false
      required: [label, place]
      properties:
        label: {type: string, maxLength: 50}
        place: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        isSensitive: {type: boolean, default: true}
    SavedPlace:
      type: object
      additionalProperties: false
      required: [id, label, place, createdAt]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, maxLength: 50}
        place: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        isSensitive: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SavedPlaceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: {type: string, maxLength: 50}
        place: {$ref: './common/components.v1.yaml#/components/schemas/PlaceRef'}
        isSensitive: {type: boolean}
    FavoriteJourneyInput:
      type: object
      additionalProperties: false
      required: [nickname, originSavedPlaceId, destinationSavedPlaceId, defaultConstraints]
      properties:
        nickname: {type: string, maxLength: 100}
        originSavedPlaceId: {type: string, format: uuid}
        destinationSavedPlaceId: {type: string, format: uuid}
        defaultConstraints:
          type: object
          additionalProperties: true
          deprecated: true
          description: Opaque Public 1.x compatibility payload. New consumers must not interpret it.
        searchConditions: {$ref: '#/components/schemas/FavoriteJourneySearchConditionsV1'}
    FavoriteJourney:
      type: object
      additionalProperties: false
      required: [id, nickname, originSavedPlaceId, destinationSavedPlaceId, defaultConstraints, createdAt]
      properties:
        id: {type: string, format: uuid}
        nickname: {type: string, maxLength: 100}
        originSavedPlaceId: {type: string, format: uuid}
        destinationSavedPlaceId: {type: string, format: uuid}
        defaultConstraints:
          type: object
          additionalProperties: true
          deprecated: true
          description: Opaque Public 1.x compatibility payload. New consumers must not interpret it.
        searchConditions:
          oneOf:
            - {$ref: '#/components/schemas/FavoriteJourneySearchConditionsV1'}
            - {type: 'null'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    FavoriteJourneyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname: {type: string, maxLength: 100}
        originSavedPlaceId: {type: string, format: uuid}
        destinationSavedPlaceId: {type: string, format: uuid}
        defaultConstraints:
          type: object
          additionalProperties: true
          deprecated: true
          description: Opaque Public 1.x compatibility payload. New consumers must not interpret it.
        searchConditions: {$ref: '#/components/schemas/FavoriteJourneySearchConditionsV1'}
    FavoriteJourneySearchConditionsV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, departurePolicy, taxiBudget, preferences, requestedRecommendations]
      properties:
        schemaVersion: {type: integer, const: 1}
        departurePolicy: {type: string, const: DEPART_AT_CLICK}
        taxiBudget: {$ref: './common/components.v1.yaml#/components/schemas/TaxiBudget'}
        preferences: {$ref: '#/components/schemas/PublicRouteSearchPreferences'}
        requestedRecommendations:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [FASTEST, STABLE, EFFICIENT, PUBLIC_TRANSIT_ONLY]}
    FavoriteJourneyFromPlacesInput:
      type: object
      additionalProperties: false
      required: [nickname, originPlace, destinationPlace, searchConditions]
      properties:
        nickname: {type: string, minLength: 1, maxLength: 100}
        originPlace: {$ref: '#/components/schemas/SavedPlaceInput'}
        destinationPlace: {$ref: '#/components/schemas/SavedPlaceInput'}
        searchConditions: {$ref: '#/components/schemas/FavoriteJourneySearchConditionsV1'}
    FavoriteJourneyFromPlacesResult:
      type: object
      additionalProperties: false
      description: >-
        Immutable receipt returned for both first creation and same-body replay during
        the 24-hour idempotency window. It intentionally contains no coordinates,
        labels, request body, or mutable resource representation.
      required:
        - favoriteJourneyId
        - originSavedPlaceId
        - destinationSavedPlaceId
        - createdAt
        - idempotencyExpiresAt
      properties:
        favoriteJourneyId: {type: string, format: uuid}
        originSavedPlaceId: {type: string, format: uuid}
        destinationSavedPlaceId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        idempotencyExpiresAt:
          type: string
          format: date-time
          description: Exclusive end of the 24-hour durable replay window.
    ConsentType:
      type: string
      enum: [SERVICE_PRIVACY, SEARCH_HISTORY, PRECISE_LOCATION, PRODUCT_ANALYTICS, ROUTING_FEEDBACK]
    ConsentInput:
      type: object
      additionalProperties: false
      required: [documentVersion, accepted]
      properties:
        documentVersion: {type: string, minLength: 1, maxLength: 64}
        accepted: {type: boolean}
    ConsentRecord:
      type: object
      additionalProperties: false
      required: [consentType, documentVersion, accepted, recordedAt]
      properties:
        consentType: {$ref: '#/components/schemas/ConsentType'}
        documentVersion: {type: string}
        accepted: {type: boolean}
        recordedAt: {type: string, format: date-time}
    DataRightsJob:
      type: object
      additionalProperties: false
      required: [jobId, type, status, requestedAt]
      properties:
        jobId: {type: string, format: uuid}
        type: {type: string, enum: [EXPORT, DELETE]}
        status: {type: string, enum: [PENDING, RUNNING, COMPLETE, FAILED]}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: Short-lived same-user URL returned only for a completed export.
        downloadExpiresAt: {type: [string, 'null'], format: date-time}
        failureCode: {type: [string, 'null']}
    PublicCapabilities:
      type: object
      additionalProperties: false
      required: [features, degraded]
      properties:
        region:
          type: object
          properties:
            originSupported: {type: boolean}
            destinationSupported: {type: boolean}
        features:
          type: object
          properties:
            currentTransit: {type: boolean}
            futureTransit: {type: boolean}
            currentTaxi: {type: boolean}
            futureTaxi: {type: boolean}
            multiDestinationTaxi: {type: boolean}
            busSeatRisk: {type: boolean}
            busEtaModel: {type: boolean}
            taxiBridge: {type: boolean}
            realtimeRerouting: {type: boolean}
        busIntelligenceCoverage: {type: string, enum: [LIVE, PARTIAL, HISTORICAL, UNSUPPORTED, UNKNOWN]}
        degraded: {type: array, items: {type: string}}
