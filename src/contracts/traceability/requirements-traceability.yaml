schemaVersion: '1.2'
project: budget-route-platform
sourceOfTruth: src/docs/shared/PRD.md
requirements:
  FR-PLACE-001:
    title: 장소명·주소 자동완성과 좌표 확정
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1places~1suggest
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [CT-SVC-PLACE-001, E2E-SEARCH-001]
    releaseGate: place-search-contract-and-abuse-controls
  FR-BIKE-001:
    title: 공식 스냅샷 기반 인근 따릉이 대여소와 단순 주행 예상시간
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1bike-options
      - src/contracts/openapi/service-public.v1.yaml#/components/schemas/BikeOptionsResponse
    implementationPaths:
      - src/services/service-api/bikes
      - src/apps/web
    tests: [CT-SVC-BIKE-001, CT-UI-BIKE-001]
    releaseGate: official-station-snapshot-and-honest-bike-estimate-disclosure
  FR-BIKE-002:
    title: 서로 다른 대여소 사이 직선거리와 시속 15km 예상시간
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/components/schemas/BikeRideEstimate
    implementationPaths:
      - src/services/service-api/bikes
    tests: [UT-SVC-BIKE-DURATION-001, CT-SVC-BIKE-001]
    releaseGate: deterministic-straight-line-duration-and-station-reference-invariants
  FR-BIKE-003:
    title: 기존 경로 순위와 분리하고 계산 방식·실시간 수량 미제공 표시
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/components/schemas/BikeOptionsResponse
    implementationPaths:
      - src/apps/web
    tests: [CT-UI-BIKE-001, A11Y-BIKE-001]
    releaseGate: supplemental-bike-option-and-honest-disclosure-rendered
  FR-ROUTE-010:
    title: strict budget은 taxi upper cost 기준
    owner: routing-intelligence
    contracts:
      - src/contracts/openapi/common/components.v1.yaml#/components/schemas/MoneyRange
      - src/contracts/openapi/common/components.v1.yaml#/components/schemas/RouteConstraints
    implementationPaths:
      - src/packages/routing-domain
    tests: [UT-BUDGET-001, PROP-BUDGET-001, FIELD-BUDGET-R1-R4]
    releaseGate: zero-verified-strict-budget-violations
  FR-BUS-001:
    title: Transit BUS step을 GBIS route·station·direction과 매핑
    owner: routing-intelligence
    contracts:
      - src/contracts/database/routing-db.dbml
      - src/contracts/openapi/common/components.v1.yaml#/components/schemas/BusLegIntelligence
    implementationPaths:
      - src/packages/provider-core
      - src/services/routing-api
    tests: [MAP-GOLD-001, MAP-DIRECTION-001, MAP-LOW-BLOCK-001]
    releaseGate: high-mapping-precision
  FR-BUS-010:
    title: missing label을 negative로 사용하지 않음
    owner: routing-intelligence
    contracts:
      - src/contracts/database/routing-db.dbml
    implementationPaths:
      - src/workers/model-jobs
      - src/packages/bus-intelligence-core
    tests: [MODEL-LABEL-NULL-001, MODEL-LEAKAGE-001]
    releaseGate: label-coverage-and-null-policy
  FR-OPT-002:
    title: 지배 후보 제거와 Pareto Frontier
    owner: routing-intelligence
    contracts:
      - src/contracts/openapi/routing-private.v1.yaml#/components/schemas/OptimizeRouteResponse
    implementationPaths:
      - src/packages/routing-domain
    tests: [UT-PARETO-001, PROP-PARETO-001, REPLAY-R1-R4, CT-CANONICAL-R1-CHAIN, CT-CODE-REGISTRY-OUTPUT]
    releaseGate: deterministic-frontier-replay
  FR-UI-007:
    title: COMPLETE·PARTIAL·unsupported·expired 상태 표현
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml
      - src/contracts/codes/reason-warning-error-codes.yaml
    implementationPaths:
      - src/apps/web
      - src/services/service-api
    tests: [CT-STATUS-001, E2E-PARTIAL-001, E2E-EXPIRED-001, E2E-ERROR-MATRIX-422-504, CT-PUBLIC-PROJECTION-REDACTION]
    releaseGate: all-semantic-states-rendered
  FR-IAM-005:
    title: 검색 기록·장소·계정 삭제
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml
      - src/contracts/database/service-db.dbml
    implementationPaths:
      - src/services/service-api
    tests: [DATA-DELETE-001, SEC-IDOR-DELETE-001]
    releaseGate: deletion-runbook-and-evidence
  FR-IAM-001:
    title: 비회원 즉시 검색과 guest ownership
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1guest-sessions
      - src/contracts/database/service-db.dbml
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [CT-SVC-GUEST-001, SEC-GUEST-TOKEN-001, SEC-IDOR-SEARCH-001]
    releaseGate: guest-token-expiry-ownership-and-redaction
  FR-IAM-002:
    title: 선택적 이메일 가입·로그인과 USER session
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1auth~1register
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1auth~1login
      - src/contracts/database/service-db.dbml
      - src/contracts/codes/reason-warning-error-codes.yaml
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [CT-SVC-IAM-REGISTER-001, CT-SVC-IAM-CONSENT-001, CT-SVC-IAM-LOGIN-001, SEC-IAM-BRUTEFORCE-001, SEC-IAM-SESSION-001]
    releaseGate: password-hashing-profile-consent-generic-failure-csrf-and-session-revocation
  FR-IAM-003:
    title: 검색 기록·저장 장소·typed 즐겨찾기 quick search
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml
      - src/contracts/database/service-db.dbml
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [CT-SVC-HISTORY-001, CT-SVC-HISTORY-SUMMARY-001, CT-SVC-SAVED-PLACE-001, CT-SVC-FAVORITE-001, CT-SVC-FAVORITE-TYPED-001, CT-SVC-FAVORITE-ATOMIC-001, CT-SVC-FAVORITE-IDEMPOTENCY-001, CT-SVC-FAVORITE-DURABLE-REPLAY-001, SEC-IDOR-RESOURCE-001, SEC-FAVORITE-LOCATION-CONSENT-001, SEC-FAVORITE-LEDGER-REDACTION-001]
    releaseGate: owner-scoped-history-typed-favorite-atomicity-idempotency-and-redaction
  FR-IAM-004:
    title: 이동 선호 설정과 optimistic concurrency
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1me~1preferences
      - src/contracts/database/service-db.dbml
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [CT-SVC-PREFERENCE-001, API-PREFERENCE-CONFLICT-001]
    releaseGate: preference-etag-conflict-detection
  FR-IAM-006:
    title: 사용자 데이터 export
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1me~1data-exports
      - src/contracts/database/service-db.dbml
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [DATA-EXPORT-001, SEC-IDOR-EXPORT-001, SEC-EXPORT-URL-001]
    releaseGate: export-owner-expiry-and-audit
  FR-IAM-007:
    title: 위치·피드백 동의 기록
    owner: service-product
    contracts:
      - src/contracts/openapi/service-public.v1.yaml#/paths/~1api~1v1~1me~1consents
      - src/contracts/database/service-db.dbml
    implementationPaths:
      - src/services/service-api
      - src/apps/web
    tests: [DATA-CONSENT-001, API-HISTORY-CONSENT-001]
    releaseGate: versioned-consent-record-and-withdrawal
  FR-OPS-004:
    title: Public·Routing health·version endpoint
    owner: joint
    contracts:
      - src/contracts/openapi/service-public.v1.yaml
      - src/contracts/openapi/routing-private.v1.yaml
    implementationPaths:
      - src/services/service-api
      - src/services/routing-api
    tests: [OPS-HEALTH-001, OPS-VERSION-001, CT-VERSION-PROVENANCE-001]
    releaseGate: readiness-and-version-observable
