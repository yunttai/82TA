# Provider probe 전에 egress proxy만 먼저 시작
- name: Start bootstrap provider egress proxy
  env:
    SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
  run: |
    set -euo pipefail
    ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
    set -euo pipefail
    cd /opt/82ta

    compose=(
      sudo -n docker compose
      --env-file .env
      --env-file .provider.env
      --env-file .deploy.env
      -f docker-compose.prod.yml
    )

    "${compose[@]}" config --quiet
    "${compose[@]}" pull routing-egress-proxy
    "${compose[@]}" up -d --wait --wait-timeout 120 routing-egress-proxy
    EOF

# routing-api보다 반드시 먼저 runtime evidence 생성
- name: Probe Providers and create runtime evidence
  env:
    SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
  run: |
    set -euo pipefail
    ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
    set -euo pipefail

    sudo -n /usr/local/sbin/82ta-refresh-provider-evidence
    sudo -n test -s /opt/82ta/.runtime/provider-evidence.env

    echo "provider evidence ready"
    EOF

# 전체 stack을 한방에 띄우지 않고 순서대로 올림
- name: Start HTTP stack in dependency order
  env:
    SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
  run: |
    set -euo pipefail
    ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
    set -euo pipefail
    cd /opt/82ta

    compose=(
      sudo -n docker compose
      --env-file .env
      --env-file .provider.env
      --env-file .deploy.env
      --env-file .runtime/provider-evidence.env
      -f docker-compose.prod.yml
    )

    dump_failure() {
      rc=$?

      echo "=== docker compose ps -a ===" >&2
      "${compose[@]}" ps -a >&2 || true

      echo "=== unhealthy/restarting container diagnostics ===" >&2

      while read -r id; do
        [[ -n "$id" ]] || continue

        name=$(sudo -n docker inspect \
          --format '{{.Name}}' "$id" 2>/dev/null |
          sed 's#^/##' || true)

        echo "===== ${name:-$id} =====" >&2

        sudo -n docker inspect \
          --format '{{json .State}}' "$id" >&2 || true

        sudo -n docker logs --tail 200 "$id" >&2 || true
      done < <(
        sudo -n docker ps -aq --filter health=unhealthy
        sudo -n docker ps -aq --filter status=restarting
        sudo -n docker ps -aq --filter status=exited
      )

      exit "$rc"
    }

    trap dump_failure ERR

    "${compose[@]}" config --quiet

    "${compose[@]}" pull \
      routing-db \
      routing-redis \
      routing-egress-proxy \
      routing-api \
      service-api \
      web \
      nginx

    # 1. DB / Redis / Provider proxy
    "${compose[@]}" up -d \
      --remove-orphans \
      --wait \
      --wait-timeout 120 \
      routing-db routing-redis routing-egress-proxy

    # 2. Routing API
    "${compose[@]}" up -d \
      --force-recreate \
      --wait \
      --wait-timeout 180 \
      routing-api

    # 3. Service API
    "${compose[@]}" up -d \
      --force-recreate \
      --wait \
      --wait-timeout 180 \
      service-api

    # 4. Web
    "${compose[@]}" up -d \
      --force-recreate \
      --wait \
      --wait-timeout 120 \
      web

    # 5. Public nginx
    "${compose[@]}" up -d \
      --force-recreate \
      --wait \
      --wait-timeout 120 \
      nginx

    trap - ERR
    "${compose[@]}" ps
    EOF