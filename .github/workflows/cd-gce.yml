name: CD - Required GCE Platform

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gce-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: gce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check image-build inputs
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KAKAO_JS_API_KEY: ${{ secrets.KAKAO_JS_API_KEY }}
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN KAKAO_JS_API_KEY; do
            if [[ -z ${!name:-} ]]; then
              echo "Missing required GCE secret: $name" >&2
              exit 1
            fi
          done
          [[ $DOCKERHUB_USERNAME =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "DOCKERHUB_USERNAME has an invalid format" >&2
            exit 1
          }

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/web/Dockerfile
          push: true
          build-args: |
            KAKAO_JS_API_KEY=${{ secrets.KAKAO_JS_API_KEY }}
            VITE_PRIVACY_DOCUMENT_VERSION=privacy-v1
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-web:latest
          cache-from: type=gha,scope=82ta-web
          cache-to: type=gha,mode=max,scope=82ta-web

      - name: Build & Push Service API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/service-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-service-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-service-api:latest
          cache-from: type=gha,scope=82ta-service-api
          cache-to: type=gha,mode=max,scope=82ta-service-api

      - name: Build & Push Routing API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/routing-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-routing-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-routing-api:latest
          cache-from: type=gha,scope=82ta-routing-api
          cache-to: type=gha,mode=max,scope=82ta-routing-api

      - name: Build & Push Provider Egress Proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src
          file: src/infra/docker/provider-egress-proxy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-provider-egress-proxy:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/82ta-provider-egress-proxy:latest
          cache-from: type=gha,scope=82ta-provider-egress-proxy
          cache-to: type=gha,mode=max,scope=82ta-provider-egress-proxy

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: gce
    env:
      REMOTE_DIR: /opt/82ta
      DOMAIN: ${{ secrets.DOMAIN }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check blank-server deployment inputs
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          HOST_KEY: ${{ secrets.HOST_KEY }}
          USER: ${{ secrets.USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GBIS_SERVICE_KEY: ${{ secrets.GBIS_SERVICE_KEY }}
          GITS_API_KEY: ${{ secrets.GITS_API_KEY }}
          TMAP_APP_KEY: ${{ secrets.TMAP_APP_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          required=(
            SSH_KEY HOST HOST_KEY USER DOMAIN LETSENCRYPT_EMAIL
            DOCKERHUB_USERNAME DOCKERHUB_TOKEN KAKAO_REST_API_KEY
            GBIS_SERVICE_KEY GITS_API_KEY TMAP_APP_KEY ODSAY_API_KEY
          )

          for name in "${required[@]}"; do
            if [[ -z ${!name:-} ]]; then
              echo "Missing required GCE secret: $name" >&2
              exit 1
            fi
          done

          [[ $DOCKERHUB_USERNAME =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "DOCKERHUB_USERNAME has an invalid format" >&2
            exit 1
          }
          [[ $USER =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || {
            echo "USER has an invalid format" >&2
            exit 1
          }
          [[ $DOMAIN =~ ^([A-Za-z0-9-]+\.)+[A-Za-z]{2,63}$ ]] || {
            echo "DOMAIN has an invalid format" >&2
            exit 1
          }
          [[ $LETSENCRYPT_EMAIL =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$ ]] || {
            echo "LETSENCRYPT_EMAIL has an invalid format" >&2
            exit 1
          }

          for name in KAKAO_REST_API_KEY GBIS_SERVICE_KEY GITS_API_KEY TMAP_APP_KEY ODSAY_API_KEY; do
            value=${!name}
            if [[ ! $value =~ ^[[:graph:]]+$ || $value == *"'"* ]]; then
              echo "$name must be a single printable API-key value" >&2
              exit 1
            fi
          done

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add pinned host key
        env:
          HOST: ${{ secrets.HOST }}
          HOST_KEY: ${{ secrets.HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "Failed to register SSH host key for $HOST" >&2
            exit 1
          }

      - name: Check SSH and passwordless sudo
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10
          "$SSH_TARGET"
          "sudo -n true && command -v apt-get >/dev/null"

      - name: Bootstrap the blank server
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/bootstrap-host.sh \
            "$SSH_TARGET:/tmp/bootstrap-host.sh"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/refresh-provider-evidence.sh \
            "$SSH_TARGET:/tmp/refresh-provider-evidence.sh"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            "sudo -n bash /tmp/bootstrap-host.sh"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
            "rm -f /tmp/bootstrap-host.sh /tmp/refresh-provider-evidence.sh"

      - name: Verify remote bootstrap
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          command -v docker >/dev/null
          sudo -n docker compose version >/dev/null
          test -d /opt/82ta
          test -f /opt/82ta/.env
          test -x /usr/local/sbin/82ta-refresh-provider-evidence
          sudo -n install -d -m 0755 /opt/82ta/nginx /opt/82ta/.runtime
          EOF

      - name: Login the server to Docker Hub
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" \
              "sudo -n docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Install deployment and Provider environment
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GBIS_SERVICE_KEY: ${{ secrets.GBIS_SERVICE_KEY }}
          GITS_API_KEY: ${{ secrets.GITS_API_KEY }}
          TMAP_APP_KEY: ${{ secrets.TMAP_APP_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077

          provider_file=$(mktemp)
          deploy_file=$(mktemp)
          trap 'rm -f "$provider_file" "$deploy_file"' EXIT

          printf '%s\n' \
            "KAKAO_REST_API_KEY='$KAKAO_REST_API_KEY'" \
            "GBIS_SERVICE_KEY='$GBIS_SERVICE_KEY'" \
            "GITS_API_KEY='$GITS_API_KEY'" \
            "TMAP_APP_KEY='$TMAP_APP_KEY'" \
            "ODSAY_API_KEY='$ODSAY_API_KEY'" > "$provider_file"

          printf '%s\n' \
            "DOMAIN=$DOMAIN" \
            "LETSENCRYPT_EMAIL=$LETSENCRYPT_EMAIL" \
            "IMAGE_TAG=$IMAGE_TAG" \
            "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" > "$deploy_file"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$provider_file" "$SSH_TARGET:/tmp/82ta.provider.env"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$deploy_file" "$SSH_TARGET:/tmp/82ta.deploy.env"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          sudo -n install -o 10002 -g 10002 -m 600 \
            /tmp/82ta.provider.env /opt/82ta/.provider.env
          sudo -n install -o root -g root -m 600 \
            /tmp/82ta.deploy.env /opt/82ta/.deploy.env
          rm -f /tmp/82ta.provider.env /tmp/82ta.deploy.env
          EOF

      - name: Upload Compose and Nginx configurations
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/docker-compose.prod.yml \
            "$SSH_TARGET:/tmp/82ta-docker-compose.prod.yml"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/nginx/default.http.conf.template \
            "$SSH_TARGET:/tmp/82ta-default.http.conf.template"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            src/infra/gce/nginx/default.https.conf.template \
            "$SSH_TARGET:/tmp/82ta-default.https.conf.template"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail

          sudo -n install -o root -g root -m 0644 \
            /tmp/82ta-docker-compose.prod.yml \
            /opt/82ta/docker-compose.prod.yml

          # HTTP/HTTPS 원본을 둘 다 보존하고 current template만 HTTP로 시작한다.
          sudo -n install -o root -g root -m 0644 \
            /tmp/82ta-default.http.conf.template \
            /opt/82ta/nginx/default.http.conf.template

          sudo -n install -o root -g root -m 0644 \
            /tmp/82ta-default.https.conf.template \
            /opt/82ta/nginx/default.https.conf.template

          sudo -n cp \
            /opt/82ta/nginx/default.http.conf.template \
            /opt/82ta/nginx/default.conf.template

          rm -f \
            /tmp/82ta-docker-compose.prod.yml \
            /tmp/82ta-default.http.conf.template \
            /tmp/82ta-default.https.conf.template
          EOF

      # Provider probe가 routing egress proxy를 필요로 할 수 있으므로 먼저 proxy만 올린다.
      # 이 단계에서는 provider-evidence.env가 아직 없으므로 runtime env file을 사용하지 않는다.
      - name: Start bootstrap provider egress proxy
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/82ta

          compose=(
            sudo -n docker compose
            --env-file .env
            --env-file .provider.env
            --env-file .deploy.env
            -f docker-compose.prod.yml
          )

          "${compose[@]}" config --quiet
          "${compose[@]}" pull routing-egress-proxy
          "${compose[@]}" up -d --wait --wait-timeout 120 routing-egress-proxy
          EOF

      # 반드시 app stack보다 먼저 실행한다.
      # routing-api가 사용하는 runtime/provider-evidence.env를 여기서 생성한다.
      - name: Probe Providers and create runtime evidence
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          sudo -n /usr/local/sbin/82ta-refresh-provider-evidence
          sudo -n test -s /opt/82ta/.runtime/provider-evidence.env
          echo "provider evidence ready"
          EOF

      # 핵심: 한 번에 web/service-api/routing-api를 동시에 올리지 않는다.
      # infra -> routing-api -> service-api -> web -> nginx 순으로 health를 확인한다.
      - name: Start HTTP stack in dependency order
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/82ta

          compose=(
            sudo -n docker compose
            --env-file .env
            --env-file .provider.env
            --env-file .deploy.env
            --env-file .runtime/provider-evidence.env
            -f docker-compose.prod.yml
          )

          dump_failure() {
            rc=$?
            echo "=== docker compose ps -a ===" >&2
            "${compose[@]}" ps -a >&2 || true
            echo "=== unhealthy/restarting container diagnostics ===" >&2
            while read -r id; do
              [[ -n "$id" ]] || continue
              name=$(sudo -n docker inspect --format '{{.Name}}' "$id" 2>/dev/null | sed 's#^/##' || true)
              echo "===== ${name:-$id} =====" >&2
              sudo -n docker inspect --format '{{json .State}}' "$id" >&2 || true
              sudo -n docker logs --tail 200 "$id" >&2 || true
            done < <(
              sudo -n docker ps -aq --filter health=unhealthy
              sudo -n docker ps -aq --filter status=restarting
              sudo -n docker ps -aq --filter status=exited
            )
            exit "$rc"
          }
          trap dump_failure ERR

          "${compose[@]}" config --quiet
          "${compose[@]}" pull \
            routing-db \
            routing-redis \
            routing-egress-proxy \
            routing-api \
            service-api \
            web \
            nginx

          # 1) stateful/base dependencies
          "${compose[@]}" up -d --remove-orphans --wait --wait-timeout 120 \
            routing-db routing-redis routing-egress-proxy

          # 2) routing layer
          "${compose[@]}" up -d --force-recreate --wait --wait-timeout 180 \
            routing-api

          # 3) service API - routing-api가 healthy인 뒤에만 시작
          "${compose[@]}" up -d --force-recreate --wait --wait-timeout 180 \
            service-api

          # 4) web nginx - service-api DNS/health가 준비된 뒤에만 시작
          "${compose[@]}" up -d --force-recreate --wait --wait-timeout 120 \
            web

          # 5) public HTTP nginx - web이 healthy인 뒤에만 시작
          "${compose[@]}" up -d --force-recreate --wait --wait-timeout 120 \
            nginx

          trap - ERR
          "${compose[@]}" ps
          EOF

      - name: Verify Service coordination backend matches current GCE topology
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/82ta

          compose=(
            sudo -n docker compose
            --env-file .env
            --env-file .provider.env
            --env-file .deploy.env
            --env-file .runtime/provider-evidence.env
            -f docker-compose.prod.yml
          )

          coordination_backend=$(
            "${compose[@]}" exec -T service-api python manage.py shell \
              -c "from django.conf import settings; print(settings.COORDINATION_BACKEND)" \
              | tail -n 1 | tr -d '\r'
          )
          if [[ "$coordination_backend" != "local" ]]; then
            echo "Expected the current single-node GCE Service coordination backend to be local, got: $coordination_backend" >&2
            exit 1
          fi
          echo "Service coordination backend: local (expected for current GCE topology)"
          EOF

      - name: Wait for HTTP
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl --fail --silent --show-error --max-time 5 \
              "http://$DOMAIN/healthz" >/dev/null; then
              echo "HTTP OK"
              exit 0
            fi
            echo "...waiting HTTP ($i/24)"
            sleep 5
          done
          echo 'HTTP health check timed out' >&2
          exit 1

      # webroot 경로/volume 설정에 의존하지 않는다.
      # nginx를 잠시 중지하고 Certbot standalone이 host port 80을 직접 사용한다.
      # 실패하면 EXIT trap이 HTTP 설정으로 즉시 롤백하고 nginx를 다시 올린다.
      - name: Issue certificate and switch Nginx to HTTPS
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/82ta

          domain=$(sudo -n sed -n 's/^DOMAIN=//p' .deploy.env)
          letsencrypt_email=$(sudo -n sed -n 's/^LETSENCRYPT_EMAIL=//p' .deploy.env)

          test -n "$domain"
          test -n "$letsencrypt_email"

          compose=(
            sudo -n docker compose
            --env-file .env
            --env-file .provider.env
            --env-file .deploy.env
            --env-file .runtime/provider-evidence.env
            -f docker-compose.prod.yml
          )

          rollback_http() {
            rc=$?
            if (( rc != 0 )); then
              echo "Certificate/HTTPS switch failed; restoring HTTP nginx" >&2

              sudo -n cp \
                /opt/82ta/nginx/default.http.conf.template \
                /opt/82ta/nginx/default.conf.template || true

              "${compose[@]}" up -d \
                --force-recreate \
                --no-deps \
                --wait \
                --wait-timeout 120 \
                nginx || true
            fi
            exit "$rc"
          }
          trap rollback_http EXIT

          # HTTP nginx가 점유한 80/443 포트를 해제한다.
          "${compose[@]}" stop nginx

          # 포트 80이 실제로 비었는지 확인한다.
          if sudo -n ss -ltn '( sport = :80 )' | tail -n +2 | grep -q .; then
            echo "TCP/80 is still occupied after stopping nginx" >&2
            sudo -n ss -ltnp '( sport = :80 )' >&2 || true
            exit 1
          fi

          # docker compose run은 기본적으로 service port를 publish하지 않으므로
          # -p 80:80으로 standalone challenge listener를 외부에 노출한다.
          "${compose[@]}" --profile tools run \
            --interactive=false \
            --no-tty \
            --rm \
            --no-deps \
            -p 80:80 \
            certbot \
            certonly \
            --standalone \
            --preferred-challenges http \
            --http-01-port 80 \
            --non-interactive \
            --keep-until-expiring \
            --email "$letsencrypt_email" \
            --cert-name "$domain" \
            -d "$domain" \
            --agree-tos \
            --no-eff-email \
            --rsa-key-size 4096 </dev/null

          # 인증서가 실제로 Certbot volume에 생겼는지 확인한다.
          "${compose[@]}" --profile tools run \
            --interactive=false \
            --no-tty \
            --rm \
            --no-deps \
            --entrypoint sh \
            certbot \
            -c "test -s '/etc/letsencrypt/live/$domain/fullchain.pem' && test -s '/etc/letsencrypt/live/$domain/privkey.pem'" \
            </dev/null

          # 인증서 확보 후에만 HTTPS template로 전환한다.
          sudo -n cp \
            /opt/82ta/nginx/default.https.conf.template \
            /opt/82ta/nginx/default.conf.template

          "${compose[@]}" up -d \
            --force-recreate \
            --no-deps \
            --wait \
            --wait-timeout 120 \
            nginx

          # docker compose run must never consume the remaining ssh bash -s
          # input. Prove that the lines after Certbot ran and that TLS is live.
          curl --fail --silent --show-error --max-time 5 \
            --resolve "$domain:443:127.0.0.1" \
            "https://$domain/healthz" >/dev/null
          curl --fail --silent --show-error --max-time 5 \
            --resolve "$domain:443:127.0.0.1" \
            "https://$domain/api/v1/health" >/dev/null

          trap - EXIT
          echo "Certificate issued and HTTPS nginx is healthy"
          EOF

      - name: Verify HTTPS
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl --fail --silent --show-error --max-time 5 \
                "https://$DOMAIN/healthz" >/dev/null \
              && curl --fail --silent --show-error --max-time 5 \
                "https://$DOMAIN/api/v1/health" >/dev/null; then
              echo "HTTPS OK"
              exit 0
            fi
            echo "...waiting HTTPS ($i/18)"
            sleep 10
          done
          echo 'HTTPS health check timed out' >&2
          exit 1

      - name: Install and enable maintenance timers
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" bash -s <<'EOF'
          set -euo pipefail

          # 기존 certificate-renew unit이 webroot를 사용해도 재발하지 않도록
          # standalone 방식의 host-side renewal script/service/timer로 덮어쓴다.
          sudo -n tee /usr/local/sbin/82ta-certificate-renew >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cd /opt/82ta

          compose=(
            docker compose
            --env-file .env
            --env-file .provider.env
            --env-file .deploy.env
            --env-file .runtime/provider-evidence.env
            -f docker-compose.prod.yml
          )

          restore_nginx() {
            rc=$?
            "${compose[@]}" up -d \
              --force-recreate \
              --no-deps \
              --wait \
              --wait-timeout 120 \
              nginx || true
            exit "$rc"
          }
          trap restore_nginx EXIT

          "${compose[@]}" stop nginx

          if ss -ltn '( sport = :80 )' | tail -n +2 | grep -q .; then
            echo "TCP/80 is occupied; cannot run Certbot standalone renewal" >&2
            ss -ltnp '( sport = :80 )' >&2 || true
            exit 1
          fi

          "${compose[@]}" --profile tools run \
            --interactive=false \
            --no-tty \
            --rm \
            --no-deps \
            -p 80:80 \
            certbot \
            renew \
            --standalone \
            --preferred-challenges http \
            --non-interactive \
            --quiet </dev/null

          "${compose[@]}" up -d \
            --force-recreate \
            --no-deps \
            --wait \
            --wait-timeout 120 \
            nginx

          trap - EXIT
          SCRIPT

          sudo -n chmod 0755 /usr/local/sbin/82ta-certificate-renew
          sudo -n bash -n /usr/local/sbin/82ta-certificate-renew

          sudo -n tee /etc/systemd/system/82ta-certificate-renew.service >/dev/null <<'UNIT'
          [Unit]
          Description=82ta Let's Encrypt certificate renewal
          Wants=docker.service
          After=docker.service network-online.target
          ConditionPathExists=/opt/82ta/docker-compose.prod.yml

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/82ta-certificate-renew
          UNIT

          sudo -n tee /etc/systemd/system/82ta-certificate-renew.timer >/dev/null <<'UNIT'
          [Unit]
          Description=Weekly 82ta Let's Encrypt certificate renewal check

          [Timer]
          OnCalendar=Sun *-*-* 04:00:00
          RandomizedDelaySec=1h
          Persistent=true
          Unit=82ta-certificate-renew.service

          [Install]
          WantedBy=timers.target
          UNIT

          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now 82ta-provider-evidence-refresh.timer
          sudo -n systemctl enable --now 82ta-certificate-renew.timer

          sudo -n systemctl --no-pager --full status \
            82ta-provider-evidence-refresh.timer \
            82ta-certificate-renew.timer || true
          EOF

      - name: Dump remote diagnostics on failure
        if: failure()
        continue-on-error: true
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$SSH_TARGET" bash -s <<'EOF'
          set +e
          echo '=== docker ps -a ==='
          sudo -n docker ps -a

          echo '=== unhealthy/restarting/exited logs ==='
          ids=$(
            {
              sudo -n docker ps -aq --filter health=unhealthy
              sudo -n docker ps -aq --filter status=restarting
              sudo -n docker ps -aq --filter status=exited
            } | sort -u
          )

          for id in $ids; do
            name=$(sudo -n docker inspect --format '{{.Name}}' "$id" 2>/dev/null | sed 's#^/##')
            echo "===== ${name:-$id} ====="
            sudo -n docker inspect --format '{{json .State}}' "$id" || true
            sudo -n docker logs --tail 200 "$id" || true
          done

          echo '=== timers ==='
          sudo -n systemctl --no-pager --full status \
            82ta-provider-evidence-refresh.timer \
            82ta-certificate-renew.timer || true
          EOF

      - name: Prune dangling images
        if: success()
        env:
          SSH_TARGET: ${{ secrets.USER }}@${{ secrets.HOST }}
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET"
          "sudo -n docker image prune -f --filter 'until=168h' || true"

  notify:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment result
        run: echo "build=${{ needs.build-and-push.result }} deploy=${{ needs.deploy.result }}"
