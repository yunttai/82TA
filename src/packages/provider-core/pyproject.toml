[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-route-provider-core"
version = "0.1.0"
description = "Framework-independent provider adapters and canonical transport values"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["provider_core*"]

[tool.setuptools.package-data]
provider_core = ["fixtures/*.json"]
