[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-route-bus-intelligence-core"
version = "0.1.0"
description = "Framework-independent bus ETA, seat risk, boardability, and wait domain"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["bus_intelligence_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
