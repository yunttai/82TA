name: service-product-staging-deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: service-product-staging
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/pr-service-product.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.SERVICE_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.SERVICE_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.SERVICE_ECS_SERVICE }}
      ECS_SUBNETS: ${{ vars.SERVICE_ECS_SUBNETS }}
      ECS_SECURITY_GROUP: ${{ vars.SERVICE_ECS_SECURITY_GROUP }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      PRIVACY_DOCUMENT_VERSION: ${{ vars.PRIVACY_DOCUMENT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Service image
        id: image
        run: |
          set -euo pipefail
          tag="git-${GITHUB_SHA}"
          docker build --file src/infra/docker/service-api/Dockerfile --tag "${ECR_REPOSITORY}:${tag}" src
          docker push "${ECR_REPOSITORY}:${tag}"
          digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="${tag}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "uri=${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Register candidate task definition
        id: task
        run: |
          set -euo pipefail
          old_task="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$old_task" --query taskDefinition > task-definition.json
          jq --arg image '${{ steps.image.outputs.uri }}' '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions |= map(if .name == "service-api" then .image = $image else . end)
          ' task-definition.json > candidate-task-definition.json
          task_policy_version="$(jq -r '.containerDefinitions[] | select(.name == "service-api") | .environment[] | select(.name == "SERVICE_CONSENT_DOCUMENT_VERSION") | .value' candidate-task-definition.json)"
          test -n "$PRIVACY_DOCUMENT_VERSION"
          test "$task_policy_version" = "$PRIVACY_DOCUMENT_VERSION"
          new_task="$(aws ecs register-task-definition --cli-input-json file://candidate-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "old=${old_task}" >> "$GITHUB_OUTPUT"
          echo "new=${new_task}" >> "$GITHUB_OUTPUT"

      - name: Run one-off migration gate
        run: |
          set -euo pipefail
          network="awsvpcConfiguration={subnets=[${ECS_SUBNETS}],securityGroups=[${ECS_SECURITY_GROUP}],assignPublicIp=DISABLED}"
          task="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition '${{ steps.task.outputs.new }}' \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides '{"containerOverrides":[{"name":"service-api","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' --output text)"
          test "$task" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          exit_code="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" --query 'tasks[0].containers[?name==`service-api`].exitCode | [0]' --output text)"
          test "$exit_code" = "0"

      - name: Deploy Service and wait for rollback-aware stabilization
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition '${{ steps.task.outputs.new }}' >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Build and publish PWA assets
        env:
          KAKAO_JS_API_KEY: ${{ vars.KAKAO_JS_API_KEY }}
          VITE_PRIVACY_DOCUMENT_VERSION: ${{ env.PRIVACY_DOCUMENT_VERSION }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix src/apps/web
          npm run build --prefix src/apps/web
          aws s3 sync src/apps/web/dist "s3://${WEB_BUCKET}" --delete --exclude "index.html" --exclude "sw.js" --exclude "manifest.webmanifest" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp src/apps/web/dist/index.html "s3://${WEB_BUCKET}/index.html" --cache-control "no-store" --content-type "text/html"
          aws s3 cp src/apps/web/dist/sw.js "s3://${WEB_BUCKET}/sw.js" --cache-control "no-store" --content-type "application/javascript"
          aws s3 cp src/apps/web/dist/manifest.webmanifest "s3://${WEB_BUCKET}/manifest.webmanifest" --cache-control "public,max-age=300,must-revalidate" --content-type "application/manifest+json"
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/index.html" "/sw.js" "/manifest.webmanifest"

      - name: Staging smoke
        run: |
          curl --fail --retry 10 --retry-all-errors --max-time 10 "${STAGING_URL}/api/v1/health"
          curl --fail --retry 10 --retry-all-errors --max-time 10 "${STAGING_URL}/"

      - name: Roll back Service task definition on post-migration failure
        if: failure() && steps.task.outputs.old != ''
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition '${{ steps.task.outputs.old }}' >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
